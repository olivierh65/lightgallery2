
core:
  params:
    license_key: '0000-0000-0000-0000'
    addClass : ''
    allowMediaOverlap : false
    appendCounterTo : '.lg-toolbar'
    appendSubHtmlTo : '.lg-sub-html'
    backdropDuration: 300
    closable: true
    closeOnTap: true
    controls: true
    counter: true
    defaultCaptionHeight: 0
    download: true
    easing : 'ease'
    enableDrag: true
    enableSwipe: true
    escapeKey: true
    height : '100%'
    hideBarsDelay: 3000
    hideControlOnEnd: false
    hideScrollbars: true
    iframeHeight: '100%'
    iframeMaxHeight: '100%'
    iframeMaxWidth: '100%'
    iframeWidth: '100%'
    index: 0
    isMobile: false
    keyPress: true
    loadYoutubePoster: true
    loop: false
    mode: 'lg-slide'
    mousewheel: false
    nextHtml: ''
    prevHtml: ''
    numberOfSlideItemsInDom: 10
    preload: 2
    resetScrollPosition: true
    showBarsAfter: 10000
    showCloseIcon: true
    showMaximizeIcon: true
    slideDelay: 0
    slideEndAnimatoin: true
    speed: 400
    swipeThreshold: 50
    swipeToClose: true
    videoMaxSize: '1280-720'
    width : '100%'
    zoomFromOrigin: true

plugins:
  zoom:
    enabled: true
    params:
      actualSize: true
      enableZoomAfter : 3000
      infiniteZoom : true
      scale: 1

  thumbnails:
    enabled: false
    params:
      alignThumbnails : 'middle'
      animateThumb : true
      appendThumbnailsTo : '.lg-components'
      currentPagerPosition : 'middle'
      enableThumbDrag : true
      enableThumbSwipe : true
      loadYoutubeThumbnail : true
      thumbHeight : '80px'
      thumbMargin : 5
      thumbWidth : 100
      thumbnailSwipeThreshold : 10
      toggleThumb : true
      youTubeThumbSize : 1  

  video:
    enabled: false
    params:
      autoplayFirstVideo : true
      autoplayVideoOnSlide : false
      gotoNextSlideOnVideoEnd : true
      youTubePlayer :
        params:
          modestbranding: 1
          rel: 0
          showinfo: 0
          controls: 1

  hash:
    enabled: false
    params:
      customSlideName : true

  autoplay:
    enabled: false
    params:
      appendAutoplayControlsTo : '.lg-toolbar'
      autoplayControls : true
      forceSlideShowAutoplay : false
      progessBar : true
      slideShowAutoplay : false
      slideShowDelay : 5000

  rotate:
    enabled: false
    params:
      flipHorizontal : true
      flipVertical : true
      rotateLeft : true
      rotateRight : true
      rotateStep : 400

  pager:
    enabled: false
    
  fullscreen:
    enabled: false
    
  